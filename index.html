<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sritesh Naidu | Explore</title>
  <meta name="description" content="Step into Sritesh Naidu's desk and explore his work, projects and story.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23f28c18'/%3E%3Ctext x='32' y='45' font-family='Impact,Arial Black,sans-serif' font-size='38' text-anchor='middle' fill='%23111'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Kaushan+Script&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/explore.css">
  <script>try{if(localStorage.getItem("sn-theme-explore")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body class="explore">
  <!-- Loading screen -->
  <div class="loader" id="loader" aria-live="polite">
    <div class="loader-inner">
      <span class="script">setting up the desk</span>
      <div class="loader-num"><span id="loader-num">0</span>%</div>
    </div>
  </div>

  <!-- 3D scene -->
  <canvas id="scene" aria-label="Interactive 3D model of Sritesh's desk. Use the section list to navigate without a mouse."></canvas>

  <!-- Hotspot markers (positioned by room.js) -->
  <div class="hotspots" id="hotspots"></div>

  <!-- Intro text over the scene -->
  <div class="intro" id="intro">
    <span class="kicker"></span>
    <h1 class="display intro-name"></h1>
    <p class="intro-hint">Click anything with an orange dot to explore.</p>
  </div>

  <!-- Keyboard / screen reader friendly section list -->
  <nav class="section-index" id="section-index" aria-label="Sections"></nav>

  <!-- Section panel -->
  <aside class="panel" id="panel" aria-hidden="true" tabindex="-1" data-scroll-root>
    <button class="panel-close pill" id="panel-close" type="button">&larr; Back to desk</button>
    <div class="panel-body" id="panel-body"></div>
  </aside>

  <!-- Shown if 3D can't run -->
  <div class="fallback" id="fallback" hidden>
    <div>
      <h2 class="display">This desk needs 3D</h2>
      <p>Your browser couldn't start the 3D scene. The classic version has everything.</p>
      <a class="pill accent" href="classic.html">Open classic version</a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/sections.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/room.js"></script>
</body>
</html>
